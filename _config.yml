title: "othmaneb"
author: "othmaneb"
description: "Portfolio and research blog of othmaneb (indestiny0xff): Cyber Threat Intelligence, Malware Analysis, Detection Engineering. Creator of HuntingBadGuys, a threat infrastructure intelligence platform."
url: "https://indestiny0xff.github.io"
lang: en
timezone: Europe/Paris

github_username: "indestiny0xff"
twitter_username: "indestiny_cti"

rss: rss

permalink: /blog/:title/

kramdown:
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jemoji

exclude:
  - CLAUDE.md
  - README.md
  - scripts/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      tags: [MISC]
