---
layout: default
---
<article class="post-wrap">
  <header class="post-header">
    <a class="back" href="{{ '/blog/' | relative_url }}"><span class="lang-en">← All posts</span><span class="lang-fr">← Tous les articles</span></a>
    <h1>{{ page.title }}</h1>
    <div class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      {% if page.tags and page.tags != empty %}
      <span class="tags">{% for tag in page.tags %}<i>{{ tag }}</i>{% endfor %}</span>
      {% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<script src="{{ '/js/highlightjs/highlight.min.js' | relative_url }}"></script>
<script src="{{ '/js/highlightjs/languages/powershell.min.js' | relative_url }}"></script>
<script src="{{ '/js/highlightjs/languages/plaintext.min.js' | relative_url }}"></script>
<script src="{{ '/js/highlightjs/languages/tsql.min.js' | relative_url }}"></script>
<script>hljs.highlightAll();</script>
